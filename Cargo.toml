[package]
name = "simple-player"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "simple-player"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui-phosphor = "0.7"
# Dibuja el logo SVG de la app
egui_extras = { version = "0.29", default-features = false, features = ["svg"] }

# Audio engine (idéntico al de la app Tauri)
gstreamer = "0.23"
gstreamer-player = "0.23"

# Metadata / biblioteca
lofty = "0.21"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Diálogos nativos, íconos, atajos globales, MPRIS2
rfd = "0.15"
image = "0.25"
global-hotkey = "0.6"
souvlaki = "0.8.3"
rand = "0.8"

# Estadísticas de escucha
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
